<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chrissi's password generator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔑</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Google+Sans+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
    /* design tokens */
    :root {
        --background: #ffffff;
        --accent: #000000;
        --body: #000000;
        --sub: #4f4f4f;
        --highlight: #e0e0e0;
        --glass-bg: rgba(0, 0, 0, 0.03);
        --glass-border: rgba(0, 0, 0, 0.08);
        --spacing: 8px;
        --spacing-2: 16px;
        --spacing-3: 24px;
        --spacing-4: 32px;
        --weight-body: 400;
        --weight-accent: 500;
        --border-radius: 8px;
        --border-radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --background: #000000;
            --accent: #e9e9e9;
            --body: #a2a2a2;
            --sub: #6e6e6e;
            --highlight: #222222;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
    }

    html {
        scroll-behavior: smooth;
        scrollbar-width: thin;
        scrollbar-color: var(--glass-border) transparent;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Inter";
        background: var(--background);
        color: var(--accent);
        min-height: 100vh;
        font-weight: var(--weight-body);
    }

    ::selection {
        background: var(--highlight);
    }

    .glass {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(12px);
        transition: filter 0.2s;
    }

    .page {
        max-width: 480px;
        margin: 0 auto;
        padding: clamp(28px, 6vw, 56px) clamp(20px, 4vw, 40px);
    }

    .page-title {
        font-size: 26px;
        font-weight: var(--weight-accent);
        margin-bottom: var(--spacing-4);
        color: var(--accent);
    }

    /* output */
    .output {
        border-radius: var(--border-radius-lg);
        padding: var(--spacing-3);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--spacing-2);
        margin-bottom: var(--spacing-2);
    }

    #password {
        font-family: "Google Sans Code";
        font-size: 16px;
        line-height: 1.5;
        word-break: break-all;
        color: var(--body);
    }

    #password.empty {
        color: var(--sub);
    }

    #password.refresh {
        animation: password-refresh 0.3s ease;
    }

    @keyframes password-refresh {
        0% { opacity: 0; transform: translateY(-3px); filter: blur(2px); }
        100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @media (prefers-reduced-motion: reduce) {
        #password.refresh { animation: none; }
    }

    .output-actions {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
    }

    #copy,
    #generate {
        flex-shrink: 0;
        width: 36px;
        height: 36px;
        border-radius: var(--border-radius);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--sub);
        cursor: pointer;
        transition: color 0.2s ease, background 0.2s ease, transform 0.1s ease;
    }

    #copy:hover,
    #generate:hover {
        color: var(--accent);
        background: var(--highlight);
    }

    #generate:active {
        transform: scale(0.9);
    }

    #copy svg,
    #generate svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
    }

    #copy.done {
        color: var(--accent);
        animation: copy-pop 0.3s ease;
    }

    @keyframes copy-pop {
        0% { transform: scale(1); }
        40% { transform: scale(1.15); }
        100% { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
        #copy.done { animation: none; }
    }

    .copied-msg {
        font-size: 13px;
        color: var(--sub);
        text-align: center;
        height: 16px;
        margin-bottom: var(--spacing-2);
    }

    /* strength */
    .strength {
        display: flex;
        align-items: center;
        gap: var(--spacing-2);
        font-size: 13px;
        color: var(--sub);
        margin-bottom: var(--spacing-4);
        padding: 0 4px;
    }

    .strength-bar {
        flex: 1;
        height: 2px;
        background: var(--glass-border);
        position: relative;
        border-radius: 2px;
        overflow: hidden;
    }

    .strength-bar::after {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: var(--fill, 0%);
        background: var(--accent);
        transition: width 0.2s ease;
    }

    /* options card */
    .options {
        border-radius: var(--border-radius-lg);
        padding: var(--spacing-2) var(--spacing-3);
        margin-bottom: var(--spacing-4);
    }

    .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--spacing-2);
        padding: 14px 0;
        border-bottom: 1px solid var(--glass-border);
    }

    .row:last-child {
        border-bottom: none;
    }

    .row label {
        font-size: 14px;
        color: var(--body);
    }

    .length-control {
        display: flex;
        align-items: center;
        gap: var(--spacing-2);
    }

    .length-control input[type="range"] {
        -webkit-appearance: none;
        width: 120px;
        height: 2px;
        background: var(--glass-border);
        border-radius: 2px;
        outline: none;
    }

    .length-control input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
    }

    .length-control input[type="range"]::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        border: none;
        cursor: pointer;
    }

    .length-value {
        font-family: "Google Sans Code";
        font-size: 13px;
        color: var(--sub);
        width: 22px;
        text-align: right;
    }

    .toggle {
        width: 36px;
        height: 20px;
        border-radius: 10px;
        border: 1px solid var(--glass-border);
        position: relative;
        cursor: pointer;
        background: var(--glass-bg);
        transition: background 0.2s ease, border-color 0.2s ease;
        flex-shrink: 0;
    }

    .toggle.on {
        background: var(--accent);
        border-color: var(--accent);
    }

    .toggle::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--sub);
        transition: transform 0.2s ease, background 0.2s ease;
    }

    .toggle.on::after {
        transform: translateX(16px);
        background: var(--background);
    }

    /* footer credit */
    .made-by {
        display: block;
        text-align: center;
        margin-top: var(--spacing-4);
        font-size: 13px;
        color: var(--sub);
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .made-by:hover {
        color: var(--accent);
    }
</style>
</head>
<body>

<div class="page">
    <h1 class="page-title">chrissi's password generator</h1>

    <div class="output glass">
        <span id="password" class="empty">generate a password</span>
        <div class="output-actions">
            <div id="generate" role="button" aria-label="generate new password">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" /><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" /></svg>
            </div>
            <div id="copy" role="button" aria-label="copy password">
                <svg id="copyIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M7 9.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667l0 -8.666" /><path d="M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1" /></svg>
            </div>
        </div>
    </div>
    <div class="copied-msg" id="copiedMsg"></div>

    <div class="strength">
        <span id="strengthLabel">strength</span>
        <div class="strength-bar" id="strengthBar"></div>
    </div>

    <div class="options glass">
        <div class="row">
            <label for="length">length</label>
            <div class="length-control">
                <input type="range" id="length" min="8" max="24" value="12">
                <span class="length-value" id="lengthValue">12</span>
            </div>
        </div>
        <div class="row">
            <label>uppercase (a-z)</label>
            <div class="toggle on" data-opt="upper"></div>
        </div>
        <div class="row">
            <label>lowercase (a-z)</label>
            <div class="toggle on" data-opt="lower"></div>
        </div>
        <div class="row">
            <label>numbers (0-9)</label>
            <div class="toggle on" data-opt="numbers"></div>
        </div>
        <div class="row">
            <label>symbols (!@#$…)</label>
            <div class="toggle on" data-opt="symbols"></div>
        </div>
        <div class="row">
            <label>exclude similar characters (l, 1, o, 0)</label>
            <div class="toggle" data-opt="excludeSimilar"></div>
        </div>
    </div>

    <a class="made-by" href="https://chrissitxt.me" target="_blank" rel="noopener noreferrer">made by chrissi</a>
</div>

<script>
    const CHARS = {
        upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        lower: 'abcdefghijklmnopqrstuvwxyz',
        numbers: '0123456789',
        symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
    };
    const SIMILAR = /[lI1O0]/g;

    const state = {
        length: 12,
        upper: true,
        lower: true,
        numbers: true,
        symbols: true,
        excludeSimilar: false
    };

    const lengthInput = document.getElementById('length');
    const lengthValue = document.getElementById('lengthValue');
    const passwordEl = document.getElementById('password');
    const generateBtn = document.getElementById('generate');
    const copyBtn = document.getElementById('copy');
    const copiedMsg = document.getElementById('copiedMsg');
    const strengthBar = document.getElementById('strengthBar');
    const strengthLabel = document.getElementById('strengthLabel');

    document.querySelectorAll('.toggle').forEach(t => {
        t.addEventListener('click', () => {
            const opt = t.dataset.opt;
            const charsetToggles = ['upper', 'lower', 'numbers', 'symbols'];
            const activeCount = charsetToggles.filter(o => state[o]).length;
            if (charsetToggles.includes(opt) && state[opt] && activeCount <= 1) return;
            t.classList.toggle('on');
            state[opt] = t.classList.contains('on');
            render();
        });
    });

    lengthInput.addEventListener('input', () => {
        state.length = parseInt(lengthInput.value, 10);
        lengthValue.textContent = state.length;
        render();
    });

    function buildCharset() {
        let set = '';
        if (state.upper) set += CHARS.upper;
        if (state.lower) set += CHARS.lower;
        if (state.numbers) set += CHARS.numbers;
        if (state.symbols) set += CHARS.symbols;
        if (state.excludeSimilar) set = set.replace(SIMILAR, '');
        return set;
    }

    function generatePassword() {
        const charset = buildCharset();
        if (!charset) return '';
        const values = new Uint32Array(state.length);
        crypto.getRandomValues(values);
        let result = '';
        for (let i = 0; i < state.length; i++) {
            result += charset[values[i] % charset.length];
        }
        return result;
    }

    function estimateStrength(pw) {
        if (!pw) return { pct: 0, label: 'strength' };
        let poolSize = 0;
        if (state.upper) poolSize += 26;
        if (state.lower) poolSize += 26;
        if (state.numbers) poolSize += 10;
        if (state.symbols) poolSize += 27;
        const bits = Math.log2(poolSize) * pw.length;
        if (bits >= 100) return { pct: 100, label: 'very strong' };
        if (bits >= 70) return { pct: 75, label: 'strong' };
        if (bits >= 45) return { pct: 50, label: 'medium' };
        return { pct: 20, label: 'weak' };
    }

    function render() {
        const pw = generatePassword();
        passwordEl.textContent = pw || 'select at least one character type';
        passwordEl.classList.toggle('empty', !pw);
        const s = estimateStrength(pw);
        strengthBar.style.setProperty('--fill', s.pct + '%');
        strengthLabel.textContent = s.label;
        copiedMsg.textContent = '';
        passwordEl.classList.remove('refresh');
        void passwordEl.offsetWidth;
        passwordEl.classList.add('refresh');
    }

    generateBtn.addEventListener('click', render);

    const copyIcon = document.getElementById('copyIcon');
    const CHECK_PATH = '<path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l5 5l10 -10" />';
    const COPY_PATH = '<path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M7 9.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667l0 -8.666" /><path d="M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1" />';
    let copyTimeout;

    copyBtn.addEventListener('click', async () => {
        const pw = passwordEl.textContent;
        if (!pw || passwordEl.classList.contains('empty')) return;
        try {
            await navigator.clipboard.writeText(pw);
            copiedMsg.textContent = 'copied to clipboard';
            copyIcon.innerHTML = CHECK_PATH;
            copyBtn.classList.remove('done');
            void copyBtn.offsetWidth;
            copyBtn.classList.add('done');
            clearTimeout(copyTimeout);
            copyTimeout = setTimeout(() => {
                copyIcon.innerHTML = COPY_PATH;
                copyBtn.classList.remove('done');
            }, 1500);
        } catch {
            copiedMsg.textContent = 'copy failed';
        }
    });

    render();
</script>
</body>
</html>
