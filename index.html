<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chrissi's password generator</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5fbf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔑</text></svg>">
<style>
@font-face {
    font-family: Lora;
    font-weight: 500;
    font-display: block;
    src: url(assets/lora.woff) format("woff");
}

:root {
    --background: #f5fbf7;
    --accent: #12241b;
    --body: #40594a;
    --sub: #587265;
    --highlight: #ddf1e6;
}

@media (prefers-color-scheme: dark) {
    :root {
        --background: #0f1512;
        --accent: #e6f6ee;
        --body: #9db8aa;
        --sub: #728a7d;
        --highlight: #1f2f27;
    }
}

* {
    margin: 0;
}

body {
    font-family: Lora;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.35;
    background: var(--background);
    color: var(--body);
    cursor: default;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
}

::selection {
    background: var(--highlight);
}

main {
    flex: 1;
    max-width: 500px;
    margin: 16px;
}

h1 {
    font-size: 1.25em;
    font-weight: 500;
    color: var(--accent);
}

p {
    margin-top: 16px;
}

a {
    color: inherit;
    text-underline-offset: 3px;
}

button {
    all: unset;
    cursor: pointer;
}

.i {
    width: 20px;
    height: 20px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

@keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
}

@keyframes pop {
    from { opacity: 0; transform: translateY(0.4em) scale(0.6); filter: blur(4px); }
}

@keyframes grow {
    from { transform: scale(0.5); }
}

@keyframes fade {
    from { opacity: 0; transform: translateX(-6px); }
}

main > * {
    animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
    animation-delay: calc(var(--n) * 70ms);
}

:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

#password {
    margin-top: 24px;
    padding: 16px 20px;
    border-radius: 16px;
    background: var(--highlight);
    font-size: 1.25em;
    color: var(--accent);
    word-break: break-all;
}

#password span {
    display: inline-block;
    animation: pop 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
    animation-delay: calc(var(--i) * 22ms);
}

.actions {
    display: flex;
    align-items: center;
    gap: 12px;
}

.actions button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s;
}

@media (hover: hover) {
    .actions button:hover {
        transform: translateY(-2px);
        opacity: 0.88;
    }
}

.actions button:active {
    transform: scale(0.94);
}

#generate {
    background: var(--accent);
    color: var(--background);
}

#copy {
    background: var(--highlight);
    color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--sub);
}

.swap {
    position: relative;
    width: 20px;
    height: 20px;
}

.swap .i {
    position: absolute;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
}

.swap .check {
    opacity: 0;
    transform: scale(0.4) rotate(-60deg);
}

.done .swap .copy {
    opacity: 0;
    transform: scale(0.4) rotate(60deg);
}

.done .swap .check {
    opacity: 1;
    transform: none;
}

#status:not(:empty) {
    white-space: nowrap;
    animation: fade 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.sub {
    font-size: 0.9em;
    color: var(--sub);
}

.strength {
    display: flex;
    align-items: center;
    gap: 16px;
}

.bar {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    background: var(--highlight);
}

.bar::after {
    content: "";
    display: block;
    height: 100%;
    width: var(--fill, 0%);
    border-radius: 3px;
    background: var(--accent);
    transition: width 0.6s cubic-bezier(0.34, 1.3, 0.64, 1);
}

.strength .i {
    animation: grow 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.strength .ok,
[data-ok="true"] .warn {
    display: none;
}

[data-ok="true"] .ok {
    display: block;
}

#strength {
    min-width: 6.5em;
}

.options {
    margin-top: 24px;
}

label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    cursor: pointer;
}

.length {
    justify-content: space-between;
}

.length span {
    display: flex;
    align-items: center;
    gap: 12px;
}

input {
    accent-color: var(--accent);
    cursor: pointer;
}

output {
    min-width: 2ch;
    text-align: right;
}

</style>
</head>
<body>
<main>
    <h1 style="--n:0">chrissi's password generator</h1>

    <p id="password" style="--n:1"></p>
    <p class="actions" style="--n:2">
        <button id="generate" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" /><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" /></svg>Generate</button>
        <button id="copy" type="button"><span class="swap" aria-hidden="true"><svg class="i copy" viewBox="0 0 24 24"><path d="M7 9.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667l0 -8.666" /><path d="M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1" /></svg><svg class="i check" viewBox="0 0 24 24"><path d="M5 12l5 5l10 -10" /></svg></span>Copy</button>
        <span id="status" class="sub" aria-live="polite"></span>
    </p>

    <p class="strength sub" id="meter" style="--n:3">
        <svg class="i warn" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.04 19.745c-.942 .551 -1.964 .976 -3.04 1.255a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 .195 6.015" /><path d="M19 16v3" /><path d="M19 22v.01" /></svg>
        <svg class="i ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.46 20.846a12 12 0 0 1 -7.96 -14.846a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 -.09 7.06" /><path d="M15 19l2 2l4 -4" /></svg>
        <span id="strength">Strength</span>
        <span class="bar" id="bar"></span>
    </p>

    <div class="options" id="options" style="--n:4">
        <label class="length">
            Length
            <span>
                <input type="range" id="length" min="8" max="24" value="12">
                <output id="lengthValue" for="length">12</output>
            </span>
        </label>
        <label><input type="checkbox" id="upper" checked> Uppercase (A-Z)</label>
        <label><input type="checkbox" id="lower" checked> Lowercase (a-z)</label>
        <label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
        <label><input type="checkbox" id="symbols" checked> Symbols (!@#$…)</label>
        <label><input type="checkbox" id="similar"> Exclude similar characters (l, I, 1, o, O, 0)</label>
    </div>

    <p class="sub" style="--n:5"><a href="https://chrissitxt.me">made by chrissi</a></p>
</main>

<script>
const CHARS = {
    upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    lower: "abcdefghijklmnopqrstuvwxyz",
    numbers: "0123456789",
    symbols: "!@#$%^&*()_+-=[]{}|;:,.<>?"
};
const SIMILAR = /[lI1oO0]/g;

const $ = id => document.getElementById(id);
let password = "";

function charset() {
    let set = Object.keys(CHARS).filter(k => $(k).checked).map(k => CHARS[k]).join("");
    return $("similar").checked ? set.replace(SIMILAR, "") : set;
}

function generate() {
    const set = charset();
    const length = Number($("length").value);
    // skip leftover values so every character is equally likely
    const limit = Math.floor(0x100000000 / set.length) * set.length;
    const buf = new Uint32Array(length);
    let result = "";
    while (result.length < length) {
        crypto.getRandomValues(buf);
        for (let i = 0; i < buf.length && result.length < length; i++) {
            if (buf[i] < limit) result += set[buf[i] % set.length];
        }
    }
    return result;
}

function strength() {
    // strength is based on the number of possible passwords
    const bits = Math.log2(charset().length) * password.length;
    if (bits >= 100) return ["Very strong", 100, true];
    if (bits >= 70) return ["Strong", 75, true];
    if (bits >= 45) return ["Medium", 50, false];
    return ["Weak", 20, false];
}

function render() {
    password = generate();
    const el = $("password");
    el.replaceChildren(...[...password].map((c, i) => {
        const span = document.createElement("span");
        span.textContent = c;
        span.style.setProperty("--i", i);
        return span;
    }));
    const [label, fill, ok] = strength();
    $("strength").textContent = label;
    $("meter").dataset.ok = ok;
    $("bar").style.setProperty("--fill", fill + "%");
    $("status").textContent = "";
    $("copy").classList.remove("done");
}

$("options").addEventListener("input", e => {
    // keep at least one character type on
    if (e.target.id in CHARS && !Object.keys(CHARS).some(k => $(k).checked)) e.target.checked = true;
    const out = $("lengthValue");
    if (out.textContent !== $("length").value) {
        out.textContent = $("length").value;
        out.animate([{ transform: "scale(1.3)" }, { transform: "none" }], 250);
    }
    render();
});

$("generate").addEventListener("click", () => {
    render();
    $("generate").querySelector(".i").animate(
        [{ transform: "rotate(0)" }, { transform: "rotate(360deg)" }],
        { duration: 600, easing: "cubic-bezier(0.3, 0.7, 0.2, 1)" }
    );
});

$("copy").addEventListener("click", async () => {
    try {
        await navigator.clipboard.writeText(password);
        $("status").textContent = "Copied";
        $("copy").classList.add("done");
    } catch {
        $("status").textContent = "Copy failed";
    }
});

render();
</script>
</body>
</html>
